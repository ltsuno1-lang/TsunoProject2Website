<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gallery | From Matt</title>

  <meta
    name="description"
    content="View sourdough loaves created and baked by the From Matt community."
  >

  <link rel="stylesheet" href="https://use.typekit.net/wcq5cot.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>

<body>

  <header>
    <a class="logo" href="index.html">From Matt</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="community.html">Community</a>
      <a class="active" href="gallery.html">Gallery</a>
    </nav>
  </header>

  <main>
    <h1>What We've Cooked Up</h1>

    <p>
      This collection features amazing loaves created by the From Matt
      community.
    </p>

    <section class="gallery-grid">

      <figure class="gallery-card">
       <img
  class="gallery-image"
  src="images/L1.jpeg"
  alt="Close-up of sourdough bread"
  tabindex="0"
  role="button">
        <figcaption>Made this AMAZING whole wheat loaf! -Chris</figcaption>
      </figure>

      <figure class="gallery-card">
       <img
  class="gallery-image"
  src="images/L2.jpeg"
  alt="Community member holding their sourdough loaf"
  tabindex="0"
  role="button">
        <figcaption>Finally made a perfect loaf. -Susie</figcaption>
      </figure>

      <figure class="gallery-card">
       <img
  class="gallery-image"
  src="images/L3.jpeg"
  alt="Sourdough loaf on a cutting board"
  tabindex="0"
  role="button">
        <figcaption>Been a member for a year and it paid off! -Jenny</figcaption>
      </figure>

      <figure class="gallery-card">
       <img
  class="gallery-image"
  src="images/L4.jpeg"
  alt="Sourdough loaf on a wooden board"
  tabindex="0"
  role="button">
        <figcaption>Loved this rustic loaf I made thanks! -Bryce</figcaption>
      </figure>

      <figure class="gallery-card">
       <img
  class="gallery-image"
  src="images/L5.jpg"
  alt="Sourdough loaf cooling"
  tabindex="0"
  role="button">
        <figcaption>Added choclate chips and it was so good! -Tom</figcaption>
      </figure>

      <figure class="gallery-card">
       <img
  class="gallery-image"
  src="images/L6.jpg"
  alt="Finished homemade sourdough bread"
  tabindex="0"
  role="button">

        <figcaption>Trying out these cute scoring patterns was a success! -Cassie</figcaption>
      </figure>

    </section>

    <div class="lightbox" id="lightbox" hidden>
      <div
        class="lightbox-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lightbox-caption">

       <button
  class="lightbox-close"
  id="lightbox-close"
  type="button"
  aria-label="Close enlarged image">
  &times;
</button>
        <img id="lightbox-image" src="" alt="">

        <p id="lightbox-caption"></p>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <div class="footer-content">

      <div class="footer-links">
        <h2>From Matt</h2>
        <a href="index.html">Home</a>
        <a href="community.html">Community</a>
        <a href="gallery.html">Gallery</a>
        <a href="mailto:frommatt@example.com">Contact Me</a>
      </div>

      <div class="footer-location">
        <h2>The city famous for sourdough</h2>

        <iframe
          class="footer-map"
          src="https://www.google.com/maps?q=San%20Francisco%2C%20CA&output=embed"
          title="Map showing San Francisco"
          loading="lazy">
        </iframe>
      </div>

    </div>

    <div class="footer-bottom">
  
    </div>
  </footer>

</body>
</html>
